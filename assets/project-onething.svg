<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#ot-bg)"/>
  <g transform="translate(50, 40)">
    <rect width="700" height="400" rx="16" fill="#292524" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- macOS Menu Bar -->
    <rect width="700" height="36" rx="16" fill="#1c1917"/>
    <rect y="20" width="700" height="16" fill="#1c1917"/>
    <text x="24" y="23" fill="#ffffff" font-family="sans-serif" font-size="14"></text>
    <text x="50" y="23" fill="#e7e5e4" font-family="sans-serif" font-size="12" font-weight="bold">Finder</text>
    <text x="104" y="23" fill="#a8a29e" font-family="sans-serif" font-size="12">File</text>
    <text x="140" y="23" fill="#a8a29e" font-family="sans-serif" font-size="12">Edit</text>
    <text x="178" y="23" fill="#a8a29e" font-family="sans-serif" font-size="12">View</text>
    
    <!-- Central Menu Bar Item - One Thing App -->
    <rect x="260" y="6" width="210" height="24" rx="12" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1"/>
    <text x="275" y="22" fill="#fb923c" font-family="sans-serif" font-size="12">🎯</text>
    <text x="295" y="22" fill="#ffedd5" font-family="sans-serif" font-size="11" font-weight="bold">Focus: Ship Portfolio v1.0</text>
    
    <!-- Right side menu bar icons -->
    <text x="540" y="23" fill="#a8a29e" font-family="sans-serif" font-size="12">Wi-Fi</text>
    <text x="590" y="23" fill="#a8a29e" font-family="sans-serif" font-size="12">100% 🔋</text>
    <text x="640" y="23" fill="#e7e5e4" font-family="sans-serif" font-size="12">Mon 10:48</text>
    
    <!-- Popover dropdown mockup -->
    <g transform="translate(250, 48)">
      <rect width="240" height="220" rx="12" fill="#1c1917" stroke="rgba(255,255,255,0.15)" stroke-width="1" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>
      <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">One Thing — Quick Edit</text>
      <text x="20" y="50" fill="#a8a29e" font-family="sans-serif" font-size="10">Keep your single priority front and center</text>
      
      <rect x="18" y="65" width="204" height="44" rx="8" fill="#292524" stroke="#f97316" stroke-width="1"/>
      <text x="28" y="91" fill="#ffffff" font-family="sans-serif" font-size="12">Ship Portfolio v1.0 🚀</text>
      
      <!-- Quick Options -->
      <text x="20" y="132" fill="#d6d3d1" font-family="sans-serif" font-size="11">✓ Launch at Login</text>
      <text x="20" y="154" fill="#d6d3d1" font-family="sans-serif" font-size="11">✓ Minimalist Menu Bar Mode</text>
      <text x="20" y="176" fill="#d6d3d1" font-family="sans-serif" font-size="11">✓ Native Swift &amp; AppKit</text>
      
      <rect x="18" y="190" width="95" height="20" rx="4" fill="#44403c"/>
      <text x="65" y="204" fill="#e7e5e4" font-family="sans-serif" font-size="10" text-anchor="middle">Preferences</text>
      <rect x="127" y="190" width="95" height="20" rx="4" fill="#ea580c"/>
      <text x="174" y="204" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Save</text>
    </g>
    
    <!-- Code / Architecture Note -->
    <g transform="translate(50, 290)">
      <rect width="600" height="80" rx="8" fill="#1c1917" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="24" y="30" fill="#fb923c" font-family="monospace" font-size="12">// Native macOS Development with Swift &amp; AppKit/SwiftUI</text>
      <text x="24" y="52" fill="#a8a29e" font-family="sans-serif" font-size="12">Lightweight memory footprint (&lt;15MB), launch daemon support, and automated Makefile build workflow.</text>
    </g>
  </g>
</svg>